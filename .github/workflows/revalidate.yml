name: Revalidate while in review

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  revalidate:
    name: Point an open marketplace request at the current head
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit != null }}
    env:
      PLUGIN_ID: xyzlab.omafile
      PLUGIN_NAME: Omafile
      MARKETPLACE: omacom/omarchy-plugin-marketplace
      GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip without a token
        id: token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No MARKETPLACE_TOKEN secret, nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Find an open request that is not approved yet
        id: find
        if: steps.token.outputs.proceed == 'true'
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          marketplace = os.environ["MARKETPLACE"]
          name = os.environ["PLUGIN_NAME"]

          out = subprocess.run(
              ["gh", "issue", "list", "-R", marketplace, "--state", "open",
               "--search", "%s in:title" % name,
               "--limit", "20", "--json", "number,title,labels,body"],
              capture_output=True, text=True, check=False)
          issues = json.loads(out.stdout or "[]")

          chosen = None
          for issue in issues:
              title = issue.get("title", "")
              if not (title.startswith("[Plugin]: %s" % name) or title.startswith("[Verify]: %s" % name)):
                  continue
              labels = [l["name"] for l in issue.get("labels", [])]
              if "approved-and-verified" in labels or "maintainer-verified" in labels:
                  continue
              chosen = issue
              break

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              if chosen is None:
                  print("No open unapproved request found.")
                  fh.write("number=\n")
              else:
                  print("Found issue #%s: %s" % (chosen["number"], chosen["title"]))
                  fh.write("number=%s\n" % chosen["number"])
                  fh.write("kind=%s\n" % ("verify" if chosen["title"].startswith("[Verify]") else "submission"))
          with open("/tmp/issue.json", "w") as fh:
              json.dump(chosen or {}, fh)
          PY

      - name: Skip when the request already covers this commit
        id: stale
        if: steps.find.outputs.number != ''
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          number = os.environ["ISSUE_NUMBER"]
          marketplace = os.environ["MARKETPLACE"]
          head = os.environ["HEAD_SHA"]

          out = subprocess.run(
              ["gh", "issue", "view", number, "-R", marketplace, "--json", "comments"],
              capture_output=True, text=True, check=False)
          comments = json.loads(out.stdout or "{}").get("comments", [])

          validated = ""
          for comment in comments:
              for match in re.findall(r"passed at commit `([0-9a-f]{7,40})", comment.get("body", "")):
                  validated = match
          print("last validated commit: %s" % (validated or "unknown"))
          print("current head:          %s" % head)

          stale = not validated or not head.startswith(validated.rstrip("."))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("stale=%s\n" % ("true" if stale else "false"))
          if not stale:
              print("Already validated at this commit, nothing to do.")
          PY
        env:
          ISSUE_NUMBER: ${{ steps.find.outputs.number }}

      - name: Ask for validation of the current head
        if: steps.stale.outputs.stale == 'true'
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess

          number = os.environ["ISSUE_NUMBER"]
          marketplace = os.environ["MARKETPLACE"]
          head = os.environ["HEAD_SHA"]
          kind = os.environ["ISSUE_KIND"]

          issue = json.load(open("/tmp/issue.json"))
          body = issue.get("body", "")

          note = "Head moved to %s. Please validate the current head." % head[:7]

          if kind == "verify":
              body = re.sub(r"(### Target commit\n\n)[0-9a-f]{40}", r"\g<1>" + head, body, count=1)
          else:
              body = re.sub(
                  r"(### Maintainer notes\n\n).*?(\n\n### Submission checklist)",
                  lambda m: m.group(1) + note + m.group(2),
                  body, count=1, flags=re.S)

          with open("/tmp/new-body.md", "w") as fh:
              fh.write(body)

          subprocess.run(
              ["gh", "issue", "edit", number, "-R", marketplace, "--body-file", "/tmp/new-body.md"],
              check=True)
          print("Edited issue #%s to revalidate at %s" % (number, head))
          PY
        env:
          ISSUE_NUMBER: ${{ steps.find.outputs.number }}
          ISSUE_KIND: ${{ steps.find.outputs.kind }}
