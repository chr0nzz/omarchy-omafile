name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: JavaScript tests
        run: node --test tests/*.test.js
      - name: Python tests
        run: python3 -m unittest discover -s tests -p "*_test.py" -v
      - name: House rules
        run: |
          status=0
          if git ls-files '*.qml' '*.js' | xargs -r grep -nE '^[[:space:]]*(//|/\*)'; then
            echo "Code comments found in QML or JavaScript files"
            status=1
          fi
          if git ls-files 'bin/*' '*.py' |  xargs -r grep -HnE '^[[:space:]]*#' | grep -v ':1:#!'; then
            echo "Code comments found in Python files"
            status=1
          fi
          if git ls-files | xargs -r grep -lI "$(printf '\342\200\224')"; then
            echo "Em dashes found in tracked files"
            status=1
          fi
          exit $status
