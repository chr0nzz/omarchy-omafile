name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript tests
        run: node --test tests/*.test.js
      - name: Python tests
        run: python3 -m unittest discover -s tests -p "*_test.py" -v
      - name: House rules
        run: |
          status=0
          if git ls-files '*.qml' '*.js' | xargs -r grep -nE '^[[:space:]]*(//|/\*)'; then
            echo "Code comments found in QML or JavaScript files"
            status=1
          fi
          if git ls-files 'bin/*' '*.py' |  xargs -r grep -HnE '^[[:space:]]*#' | grep -v ':1:#!'; then
            echo "Code comments found in Python files"
            status=1
          fi
          if git ls-files | xargs -r grep -lI "$(printf '\342\200\224')"; then
            echo "Em dashes found in tracked files"
            status=1
          fi
          exit $status
